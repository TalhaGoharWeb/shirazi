<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05070d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SHIRAZI</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <script src="/static/crypto.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg:      #05070d;
      --glass:   rgba(255,255,255,0.045);
      --glass2:  rgba(255,255,255,0.07);
      --border:  rgba(255,255,255,0.09);
      --cyan:    #22d3ee;
      --indigo:  #6366f1;
      --green:   #22c55e;
      --red:     #f87171;
      --amber:   #f59e0b;
      --violet:  #a78bfa;
      --text:    #e6ebf4;
      --muted:   #8b96a8;
      --radius:  18px;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
      overscroll-behavior: none;
    }
    [dir="rtl"] body { letter-spacing: 0; }
    #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.55; }
    .nebula {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(600px 400px at 15% 10%, rgba(99,102,241,0.10), transparent 70%),
        radial-gradient(500px 380px at 85% 75%, rgba(34,211,238,0.08), transparent 70%);
    }
    .glass {
      background: var(--glass);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
    }

    /* ── HEADER ── */
    header {
      position: relative; z-index: 5; flex-shrink: 0;
      display: flex; align-items: center; gap: 10px;
      padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
      border-bottom: 1px solid var(--border);
      background: rgba(5,7,13,0.72);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .logo { font-size: 15px; font-weight: 800; letter-spacing: 5px; }
    .logo em { color: var(--cyan); font-style: normal; }
    .pill {
      display: flex; align-items: center; gap: 7px; padding: 5px 12px;
      border-radius: 99px; font-size: 10px; font-weight: 800; letter-spacing: 1.6px;
      border: 1px solid var(--border); color: var(--muted);
      background: var(--glass); transition: all 0.35s;
    }
    .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .pill.live  { color: var(--green); border-color: rgba(34,197,94,0.4); background: rgba(34,197,94,0.10); }
    .pill.live .dot { background: var(--green); animation: pulse 1.6s ease-in-out infinite; box-shadow: 0 0 8px var(--green); }
    .pill.busy  { color: var(--violet); border-color: rgba(167,139,250,0.4); background: rgba(167,139,250,0.10); }
    .pill.busy .dot { background: var(--violet); animation: pulse 0.9s ease-in-out infinite; box-shadow: 0 0 8px var(--violet); }
    .pill.off   { color: var(--red); border-color: rgba(248,113,113,0.4); background: rgba(248,113,113,0.08); }
    .pill.off .dot { background: var(--red); }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.8); } }
    .spacer { flex: 1; }
    .enc-badge { font-size: 9px; font-weight: 800; letter-spacing: 1.4px; padding: 4px 9px; border-radius: 6px; display: none; }
    .enc-badge.on  { display: block; background: rgba(34,197,94,0.10); border: 1px solid rgba(34,197,94,0.3); color: var(--green); }
    .enc-badge.off { display: block; background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.25); color: var(--red); }
    .srv { font-size: 10px; font-family: ui-monospace, monospace; color: var(--muted); padding: 4px 9px; border-radius: 6px; }

    /* ── TABS ── */
    #views { position: relative; z-index: 2; flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .view { display: none; flex: 1; overflow-y: auto; padding: 14px 14px 18px; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
    .view.active { display: flex; }
    .view::-webkit-scrollbar { width: 3px; }
    .view::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .card { border-radius: var(--radius); padding: 14px 15px; }
    .card h3 { font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }

    /* ── VOICE TAB ── */
    #view-voice { align-items: center; justify-content: flex-start; padding-top: 8px; }
    #reactor-wrap { position: relative; width: 210px; height: 210px; margin: 6px auto 2px; }
    #reactor { width: 100%; height: 100%; display: block; }
    #voice-state { font-size: 12px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); min-height: 18px; text-align: center; }
    #voice-state.listening { color: var(--green); }
    #voice-state.thinking  { color: var(--violet); }
    #voice-state.speaking  { color: var(--amber); }
    #talk-btn {
      position: relative; overflow: hidden;
      width: 108px; height: 108px; border-radius: 50%; margin: 10px auto 4px;
      border: 1px solid rgba(34,211,238,0.35); cursor: pointer; user-select: none;
      background: radial-gradient(circle at 35% 30%, rgba(34,211,238,0.22), rgba(34,211,238,0.05) 60%, rgba(255,255,255,0.02));
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      color: var(--cyan); font-size: 38px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.12s, box-shadow 0.25s;
      touch-action: none;
    }
    #talk-btn:active { transform: scale(0.94); }
    #talk-btn.live {
      border-color: rgba(248,113,113,0.6); color: var(--red);
      background: radial-gradient(circle at 35% 30%, rgba(248,113,113,0.25), rgba(248,113,113,0.05) 60%, rgba(255,255,255,0.02));
      animation: talkpulse 1.1s ease-in-out infinite;
    }
    @keyframes talkpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.35); } 50% { box-shadow: 0 0 0 16px rgba(248,113,113,0); } }
    #talk-hint { font-size: 11px; color: var(--muted); text-align: center; letter-spacing: 0.6px; }
    #response-card { width: 100%; display: none; }
    #response-card.show { display: block; animation: pop 0.2s ease; }
    #response-text { font-size: 14px; line-height: 1.6; }
    #response-text .lbl { font-size: 9px; font-weight: 800; letter-spacing: 2px; color: var(--cyan); margin-bottom: 6px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .toggle { position: relative; width: 44px; height: 25px; border-radius: 99px; background: var(--glass2); border: 1px solid var(--border); cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
    .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 19px; height: 19px; border-radius: 50%; background: var(--muted); transition: all 0.2s; }
    .toggle.on { background: rgba(34,211,238,0.25); border-color: rgba(34,211,238,0.4); }
    .toggle.on::after { left: 21px; background: var(--cyan); }
    .toggle-lbl { font-size: 13px; flex: 1; }
    select.lang {
      background: var(--glass2); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 10px; font-size: 13px; outline: none;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(5px); } }

    /* ── CHAT TAB ── */
    #feed { display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 84%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; animation: pop 0.18s ease; word-wrap: break-word; }
    .msg-j { align-self: flex-start; background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.22); border-bottom-left-radius: 4px; }
    .msg-u { align-self: flex-end; background: var(--glass2); border: 1px solid var(--border); border-bottom-right-radius: 4px; }
    .msg-sys { align-self: center; font-size: 11px; color: var(--muted); padding: 2px 0; letter-spacing: 0.3px; text-align: center; }
    .msg-pending { align-self: stretch; max-width: 100%; background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.35); border-radius: 14px; }
    .lbl { font-size: 9px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; opacity: 0.5; margin-bottom: 5px; }
    .msg-j .lbl { color: var(--indigo); }
    .msg-u .lbl { color: var(--muted); text-align: right; }
    .confirm-btns { display: flex; gap: 10px; margin-top: 10px; }
    .btn {
      position: relative; overflow: hidden;
      border: 1px solid var(--border); border-radius: 12px; cursor: pointer;
      padding: 11px 16px; font-size: 12px; font-weight: 800; letter-spacing: 1.4px;
      background: var(--glass2); color: var(--text);
      transition: transform 0.1s, opacity 0.15s;
    }
    .btn:active { transform: scale(0.96); }
    .btn.primary { background: var(--indigo); border-color: var(--indigo); color: #fff; }
    .btn.danger  { background: rgba(248,113,113,0.14); border-color: rgba(248,113,113,0.45); color: var(--red); }
    .btn.ok      { background: rgba(34,197,94,0.14); border-color: rgba(34,197,94,0.45); color: var(--green); }
    .btn.sm { padding: 8px 12px; font-size: 10px; }
    .ripple-ink { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.25); transform: scale(0); animation: ripple 0.5s ease-out; pointer-events: none; }
    @keyframes ripple { to { transform: scale(3.2); opacity: 0; } }
    .chatbar { flex-shrink: 0; display: flex; gap: 8px; align-items: center; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: rgba(5,7,13,0.78); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); position: relative; z-index: 5; }
    #inp { flex: 1; padding: 12px 14px; background: var(--glass); border: 1.5px solid var(--border); border-radius: 13px; color: var(--text); font-size: 14px; outline: none; }
    #inp:focus { border-color: var(--cyan); }
    #inp::placeholder { color: var(--muted); }
    .iconbtn { width: 46px; height: 46px; border-radius: 13px; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--glass); border: 1px solid var(--border); color: var(--muted); cursor: pointer; transition: transform 0.1s; }
    .iconbtn:active { transform: scale(0.92); }

    /* ── REMOTE TAB ── */
    #pad {
      height: 190px; border-radius: var(--radius); touch-action: none; cursor: crosshair;
      position: relative; overflow: hidden; user-select: none;
      background:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
        var(--glass);
      background-size: 28px 28px;
    }
    #pad .cross { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: rgba(34,211,238,0.5); box-shadow: 0 0 10px var(--cyan); pointer-events: none; }
    .clickrow { display: flex; gap: 10px; }
    .clickrow .btn { flex: 1; padding: 13px; }
    input[type="range"] { width: 100%; accent-color: var(--cyan); }
    .dpad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 52px); gap: 8px; justify-content: center; }
    .dpad .btn { padding: 0; font-size: 18px; display: flex; align-items: center; justify-content: center; }
    .dpad .empty { visibility: hidden; }
    .keyrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    #quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .qc {
      border-radius: 14px; padding: 12px 4px; text-align: center; cursor: pointer;
      font-size: 11px; font-weight: 700; color: var(--text);
      display: flex; flex-direction: column; gap: 6px; align-items: center;
      transition: transform 0.1s;
    }
    .qc:active { transform: scale(0.93); }
    .qc .qi { font-size: 24px; }
    #quick-result { display: none; font-size: 13px; line-height: 1.6; }
    #quick-result.show { display: block; animation: pop 0.2s ease; }
    .mini-form { display: flex; flex-direction: column; gap: 8px; }
    .mini-form input { padding: 10px 12px; background: var(--glass); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 13px; outline: none; }

    /* ── SYSTEM TAB ── */
    .trow { margin-bottom: 12px; }
    .trow .tl { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; letter-spacing: 1.6px; color: var(--muted); margin-bottom: 6px; }
    .trow .tl .tv { color: var(--text); letter-spacing: 0.4px; }
    .tbar { height: 8px; border-radius: 5px; background: rgba(255,255,255,0.06); overflow: hidden; }
    .tbar .fill { height: 100%; width: 0%; border-radius: 5px; background: linear-gradient(90deg, var(--indigo), var(--cyan)); transition: width 0.7s ease; }
    .tbar .fill.warn { background: linear-gradient(90deg, var(--amber), var(--red)); }
    .selrow { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .selrow label { font-size: 11px; font-weight: 800; letter-spacing: 1.6px; color: var(--muted); text-transform: uppercase; }
    .selrow select { background: var(--glass2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 13px; outline: none; width: 100%; }
    .devstate { font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace; line-height: 1.6; }
    .kv { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--border); }
    .kv:last-child { border-bottom: none; }
    .kv .k { color: var(--muted); }
    .kv .v.good { color: var(--green); font-weight: 700; }
    .kv .v.bad { color: var(--red); font-weight: 700; }

    /* ── NAV ── */
    nav {
      flex-shrink: 0; display: flex; z-index: 5;
      border-top: 1px solid var(--border); background: rgba(5,7,13,0.82);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      padding-bottom: env(safe-area-inset-bottom);
    }
    nav button {
      flex: 1; background: none; border: none; color: var(--muted); cursor: pointer;
      padding: 10px 4px 12px; font-size: 9px; font-weight: 800; letter-spacing: 1.6px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      transition: color 0.2s;
    }
    nav button .ni { font-size: 20px; }
    nav button.active { color: var(--cyan); }

    /* ── CONFIRM MODAL ── */
    #confirm-modal {
      position: fixed; inset: 0; z-index: 50; display: none;
      align-items: center; justify-content: center; padding: 22px;
      background: rgba(3,4,8,0.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    #confirm-modal.show { display: flex; }
    #confirm-card { width: 100%; max-width: 380px; border-radius: 20px; padding: 20px; animation: pop 0.2s ease; border: 1px solid rgba(245,158,11,0.4); background: rgba(20,16,8,0.72); }
    #confirm-card h2 { font-size: 15px; letter-spacing: 1px; margin-bottom: 4px; color: var(--amber); }
    #confirm-tool { font-size: 13px; font-weight: 800; color: var(--text); margin: 8px 0 2px; font-family: ui-monospace, monospace; }
    #confirm-why, #confirm-args { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 6px; word-wrap: break-word; }
    #confirm-count { height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; margin: 14px 0 4px; overflow: hidden; }
    #confirm-count .fill { height: 100%; background: var(--amber); width: 100%; transition: width 1s linear; }
    #confirm-timer { font-size: 10px; color: var(--muted); text-align: right; margin-bottom: 8px; }

    /* ── TOAST ── */
    #toast {
      position: fixed; top: calc(70px + env(safe-area-inset-top)); left: 50%; z-index: 60;
      transform: translateX(-50%) translateY(-8px);
      background: rgba(20,24,34,0.92); border: 1px solid var(--border);
      color: var(--text); font-size: 12px; font-weight: 700; letter-spacing: 0.6px;
      padding: 9px 20px; border-radius: 99px; opacity: 0; transition: all 0.22s;
      pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #install-btn { display: none; }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="nebula"></div>

  <!-- confirm modal -->
  <div id="confirm-modal">
    <div id="confirm-card" class="glass">
      <h2 data-i18n="confirm_title">Confirmation required</h2>
      <div id="confirm-tool"></div>
      <div id="confirm-why"></div>
      <div id="confirm-args"></div>
      <div id="confirm-count"><div class="fill" id="confirm-fill"></div></div>
      <div id="confirm-timer"></div>
      <div class="confirm-btns">
        <button class="btn danger" id="confirm-deny" style="flex:1" data-i18n="deny">Deny</button>
        <button class="btn ok" id="confirm-approve" style="flex:1" data-i18n="approve">Approve</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <header>
    <div class="logo"><em>S</em>HIRAZI</div>
    <div class="pill" id="pill"><span class="dot"></span><span id="pill-txt" data-i18n="connecting">Connecting</span></div>
    <div class="enc-badge" id="enc">AES-256</div>
    <div class="spacer"></div>
    <button class="btn sm" id="install-btn" data-i18n="install_app">Install app</button>
    <div class="srv glass">__IP__:__PORT__</div>
  </header>

  <div id="views">
    <!-- ══ VOICE ══ -->
    <section class="view active" id="view-voice">
      <div id="reactor-wrap"><canvas id="reactor" width="420" height="420"></canvas></div>
      <div id="voice-state" data-i18n="tap_to_speak">Tap the orb to speak</div>
      <button id="talk-btn" aria-label="Talk">🎤</button>
      <div id="talk-hint"><span data-i18n="talk_tap">Tap to talk</span> · <span data-i18n="talk_hold">Hold to talk</span></div>
      <div class="card glass" id="response-card"><div id="response-text"></div></div>
      <div class="card glass" style="width:100%">
        <div class="row" style="margin-bottom:10px">
          <span class="toggle-lbl" data-i18n="speak_replies">Speak replies aloud</span>
          <span class="toggle on" id="speak-toggle"></span>
        </div>
        <div class="row">
          <span class="toggle-lbl">Language</span>
          <select class="lang" id="lang-sel">
            <option value="en">English</option>
            <option value="ur">اردو</option>
            <option value="ar">العربية</option>
          </select>
        </div>
      </div>
    </section>

    <!-- ══ CHAT ══ -->
    <section class="view" id="view-chat">
      <div id="feed"></div>
    </section>

    <!-- ══ REMOTE ══ -->
    <section class="view" id="view-remote">
      <div class="card glass">
        <h3 data-i18n="touchpad">Touchpad</h3>
        <div id="pad"><div class="cross"></div></div>
        <div class="clickrow" style="margin-top:10px">
          <button class="btn" id="click-left" data-i18n="left_click">LEFT CLICK</button>
          <button class="btn" id="click-right" data-i18n="right_click">RIGHT CLICK</button>
        </div>
        <div class="row" style="margin-top:12px">
          <span class="toggle-lbl" data-i18n="sensitivity">Sensitivity</span>
          <input type="range" id="sens" min="0.2" max="3" step="0.1" value="1" style="flex:1">
          <span id="sens-val" style="font-size:12px;color:var(--muted);width:32px;text-align:right">1.0</span>
        </div>
      </div>
      <div class="card glass">
        <h3>D-Pad</h3>
        <div class="dpad">
          <span class="empty"></span><button class="btn" data-key="up">▲</button><span class="empty"></span>
          <button class="btn" data-key="left">◀</button><button class="btn" data-key="down">▼</button><button class="btn" data-key="right">▶</button>
          <span class="empty"></span><button class="btn" data-key="enter" style="font-size:11px">⏎</button><span class="empty"></span>
        </div>
        <div class="keyrow" style="margin-top:10px">
          <button class="btn sm" data-key="space" data-i18n-key="space">SPACE</button>
          <button class="btn sm" data-key="esc">ESC</button>
          <button class="btn sm" data-key="tab">TAB</button>
          <button class="btn sm" data-key="f11">F11</button>
        </div>
      </div>
      <div class="card glass">
        <div class="row" style="margin-bottom:10px">
          <h3 style="margin:0;flex:1" data-i18n="quick_commands">Quick commands</h3>
          <button class="btn sm" id="qc-add" data-i18n="customize">＋ Add</button>
        </div>
        <div id="quick-grid"></div>
        <div id="qc-form" class="mini-form" style="display:none;margin-top:10px">
          <input id="qc-label" maxlength="32" data-i18n-ph="qc_label" placeholder="Label">
          <input id="qc-prompt" maxlength="500" data-i18n-ph="qc_prompt" placeholder="Prompt">
          <div class="row">
            <button class="btn sm" id="qc-cancel" data-i18n="cancel">Cancel</button>
            <button class="btn sm primary" id="qc-save" data-i18n="save">Save</button>
          </div>
        </div>
        <div id="quick-result" class="card" style="margin-top:10px;background:rgba(99,102,241,0.08)"></div>
      </div>
    </section>

    <!-- ══ SYSTEM ══ -->
    <section class="view" id="view-system">
      <div class="card glass">
        <h3 data-i18n="telemetry">Live telemetry</h3>

        <h3 data-i18n="audio_devices">Audio devices</h3>

          <label data-i18n="input_device">Microphone</label>

          <div class="devstate" id="state-in"></div>
        </div>
        <div class="selrow">
          <label data-i18n="output_device">Speaker</label>
          <select id="sel-out"></select>
          <div class="devstate" id="state-out"></div>
        </div>
        <div class="row">
          <button class="btn sm" id="audio-rescan" data-i18n="rescan">Rescan</button>
          <button class="btn sm" id="audio-test" data-i18n="test_speaker">Test speaker</button>
        </div>

      <div class="card glass">
        <h3 data-i18n="session">Session</h3>
        <div id="session-info"></div>

          <button class="btn sm danger" id="btn-revoke" data-i18n="revoke_devices">Revoke paired devices</button>
          <button class="btn sm" id="btn-logout" data-i18n="logout">Log out</button>

  </div>

  <!-- chat input bar (only on chat tab) -->
  <div class="chatbar" id="chatbar" style="display:none">
    <input id="inp" data-i18n-ph="type_command" placeholder="Send a command to SHIRAZI…" autocomplete="off">
    <label class="iconbtn" for="file-inp" title="Send file">📎</label>
    <input type="file" id="file-inp" multiple style="display:none">

  <nav>
    <button data-view="view-voice" class="active"><span class="ni">🎙️</span><span data-i18n="tab_voice">Voice</span></button>
    <button data-view="view-chat"><span class="ni">💬</span><span data-i18n="tab_chat">Chat</span></button>
    <button data-view="view-remote"><span class="ni">🎛️</span><span data-i18n="tab_remote">Remote</span></button>
    <button data-view="view-system"><span class="ni">📊</span><span data-i18n="tab_system">System</span></button>
  </nav>

  <script>
  'use strict';
  /* ═══ SHIRAZI mobile dashboard — Phase 7 ═══ */

  // ── Auth (shirazi_* keys first, legacy jarvis_* fallback) ────────────────
  const _authToken  = sessionStorage.getItem('shirazi_token') || sessionStorage.getItem('jarvis_token');
  const _sessionKey = sessionStorage.getItem('shirazi_key')   || sessionStorage.getItem('jarvis_key');
  if (!_authToken) location.replace('/login');
  const _authHeader = () => ({ 'Authorization': 'Bearer ' + _authToken });
  function _authFetch(url, opts = {}) {
    opts.headers = Object.assign({}, opts.headers, _authHeader());
    return fetch(url, opts);
  }

  // ── AES-256-CBC (CryptoJS) — legacy salt value kept intentionally ─────────
  const _AES_SALT = 'JARVIS-DASHBOARD-v1';
  let _aesKey = null;
  function _initCrypto(key) {
    if (typeof CryptoJS === 'undefined' || !key) return false;
    try { _aesKey = CryptoJS.SHA256(key + _AES_SALT); return true; } catch { return false; }
  }
  function _encrypt(plaintext) {
    if (!_aesKey || typeof CryptoJS === 'undefined') return null;
    try {
      const iv  = CryptoJS.lib.WordArray.random(16);
      const enc = CryptoJS.AES.encrypt(CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
        { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
      const hex = iv.toString(CryptoJS.enc.Hex) + enc.ciphertext.toString(CryptoJS.enc.Hex);
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
      return btoa(String.fromCharCode(...bytes));
    } catch { return null; }
  }
  const _encReady = _initCrypto(_sessionKey);
  const _encBadge = document.getElementById('enc');
  _encBadge.className = 'enc-badge ' + (_encReady ? 'on' : 'off');
  if (!_encReady) _encBadge.textContent = 'NO ENC';

  // ── i18n (en complete; ur/ar skeleton → English fallback) ─────────────────
  let STR = {}, EN = {};
  async function _loadLang(l) {
    try {
      const [en, other] = await Promise.all([
        fetch('/i18n/en.json').then(r => r.json()),
        l === 'en' ? Promise.resolve({}) : fetch('/i18n/' + l + '.json').then(r => r.json()).catch(() => ({})),
      ]);
      EN = en; STR = Object.assign({}, en, other);
    } catch { STR = EN = {}; }
    document.documentElement.lang = l;
    document.documentElement.dir = (l === 'ur' || l === 'ar') ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.getAttribute('data-i18n');
      if (STR[k]) el.textContent = STR[k];
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      const k = el.getAttribute('data-i18n-ph');
      if (STR[k]) el.placeholder = STR[k];
    });
  }
  const t = (k) => STR[k] || EN[k] || k;

  // ── Toast ─────────────────────────────────────────────────────────────────
  let _toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  // ── Ripple ────────────────────────────────────────────────────────────────
  document.addEventListener('pointerdown', (e) => {
    const b = e.target.closest('.btn, .qc, .iconbtn, #talk-btn');
    if (!b) return;
    const r = b.getBoundingClientRect();
    const s = document.createElement('span');
    s.className = 'ripple-ink';
    const d = Math.max(r.width, r.height);
    s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
    b.appendChild(s);
    setTimeout(() => s.remove(), 550);
  });

  // ── Tabs ──────────────────────────────────────────────────────────────────
  const _views = ['view-voice', 'view-chat', 'view-remote', 'view-system'];
  let _activeView = 'view-voice';
  document.querySelectorAll('nav button').forEach(btn => {
    btn.addEventListener('click', () => {
      _activeView = btn.dataset.view;
      document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b === btn));
      _views.forEach(v => document.getElementById(v).classList.toggle('active', v === _activeView));
      document.getElementById('chatbar').style.display = _activeView === 'view-chat' ? 'flex' : 'none';
      if (_activeView === 'view-system') { loadTelemetry(); loadAudio(); loadSession(); }
      if (_activeView === 'view-remote') loadQuick();
    });
  });

  // ── Connection pill ───────────────────────────────────────────────────────
  const _pill = document.getElementById('pill');
  const _pillTxt = document.getElementById('pill-txt');
  function setPill(mode, label) {
    _pill.className = 'pill ' + mode;
    _pillTxt.textContent = label;
    _pillTxt.removeAttribute('data-i18n');
  }
  const pillLive = () => setPill('live', t('live') + ' · ' + t('connected'));
  const pillOff  = () => setPill('off', t('offline'));
  const pillBusy = (s) => setPill('busy', s);

  // ── Particles ─────────────────────────────────────────────────────────────
  (function particles() {
    const cv = document.getElementById('particles');
    const cx = cv.getContext('2d');
    let W, H, ps = [];
    function size() {
      W = cv.width = innerWidth; H = cv.height = innerHeight;
      ps = Array.from({ length: Math.min(70, W / 14) }, () => ({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.8 + 0.4, s: Math.random() * 0.35 + 0.08,
        o: Math.random() * 0.5 + 0.15, ph: Math.random() * 6.28,
      }));
    }
    size(); addEventListener('resize', size);
    (function tick(ts) {
      cx.clearRect(0, 0, W, H);
      for (const p of ps) {
        p.y -= p.s; p.ph += 0.01;
        if (p.y < -4) { p.y = H + 4; p.x = Math.random() * W; }
        const tw = p.o * (0.7 + 0.3 * Math.sin(p.ph));
        cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.29);
        cx.fillStyle = `rgba(34,211,238,${tw.toFixed(3)})`; cx.fill();
      }
      requestAnimationFrame(tick);
    })();
  })();

  // ── Reactor ───────────────────────────────────────────────────────────────
  const _reactor = { state: 'idle', level: 0 };
  const STATE_COLORS = { idle: '#22d3ee', listening: '#22c55e', thinking: '#a78bfa', speaking: '#f59e0b', offline: '#5e6a7e' };
  (function reactor() {
    const cv = document.getElementById('reactor');
    const cx = cv.getContext('2d');
    const C = 210, TAU = Math.PI * 2;
    let rot = 0, rot2 = 0;
    function ring(r, w, col, alpha) {
      cx.beginPath(); cx.arc(C, C, r, 0, TAU);
      cx.strokeStyle = col; cx.globalAlpha = alpha; cx.lineWidth = w; cx.stroke();
      cx.globalAlpha = 1;
    }
    (function tick() {
      rot += 0.004; rot2 -= 0.007;
      _reactor.level *= 0.92;
      const col = STATE_COLORS[_reactor.state] || STATE_COLORS.idle;
      cx.clearRect(0, 0, 420, 420);
      // tick ring
      for (let i = 0; i < 60; i++) {
        const a = rot + (i / 60) * TAU;
        const big = i % 5 === 0;
        const r1 = 196, r2 = big ? 182 : 189;
        cx.beginPath();
        cx.moveTo(C + r1 * Math.cos(a), C + r1 * Math.sin(a));
        cx.lineTo(C + r2 * Math.cos(a), C + r2 * Math.sin(a));
        cx.strokeStyle = col; cx.globalAlpha = big ? 0.85 : 0.35; cx.lineWidth = big ? 3 : 1.5;
        cx.stroke(); cx.globalAlpha = 1;
      }
      // dashed counter-ring
      cx.setLineDash([26, 14]);
      cx.beginPath(); cx.arc(C, C, 162, rot2, rot2 + TAU);
      cx.strokeStyle = col; cx.globalAlpha = 0.4; cx.lineWidth = 5; cx.stroke();
      cx.setLineDash([]); cx.globalAlpha = 1;
      // waveform ring (breathes with mic level)
      cx.beginPath();
      for (let i = 0; i <= 72; i++) {
        const a = (i / 72) * TAU;
        const w = Math.sin(a * 3 + rot * 6) * 6 + _reactor.level * 26;
        const r = 128 + w;
        const x = C + r * Math.cos(a), y = C + r * Math.sin(a);
        i ? cx.lineTo(x, y) : cx.moveTo(x, y);
      }
      cx.closePath(); cx.strokeStyle = col; cx.globalAlpha = 0.75; cx.lineWidth = 2.5; cx.stroke();
      cx.globalAlpha = 1;
      // orbiting electrons
      for (let k = 0; k < 3; k++) {
        const a = rot * (2 + k * 0.7) + (k * TAU) / 3;
        const ex = C + 96 * Math.cos(a), ey = C + 96 * Math.sin(a);
        cx.beginPath(); cx.arc(ex, ey, 5, 0, TAU);
        cx.fillStyle = col; cx.globalAlpha = 0.9; cx.fill(); cx.globalAlpha = 1;
      }
      // core
      const pulse = 1 + 0.06 * Math.sin(performance.now() / 380) + _reactor.level * 0.25;
      const g = cx.createRadialGradient(C, C, 4, C, C, 52 * pulse);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, col); g.addColorStop(1, 'rgba(0,0,0,0)');
      cx.beginPath(); cx.arc(C, C, 52 * pulse, 0, TAU);
      cx.fillStyle = g; cx.globalAlpha = 0.95; cx.fill(); cx.globalAlpha = 1;
      ring(58, 1.5, col, 0.5);
      requestAnimationFrame(tick);
    })();
  })();
  function setVoiceState(s, label) {
    _reactor.state = s;
    const el = document.getElementById('voice-state');
    el.className = s === 'idle' ? '' : s;
    if (label !== undefined) el.textContent = label;
  }

  // ── Feed socket (dashboard events) with auto-reconnect ────────────────────
  const feed = document.getElementById('feed');
  let _feedWs = null, _feedBackoff = 1000, _feedWanted = true;
  function feedConnect() {
    if (!_feedWanted) return;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    let ws;
    try { ws = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`); }
    catch { scheduleFeedRetry(); return; }
    _feedWs = ws;
    ws.onopen = () => {
      _feedBackoff = 1000; pillLive();
      sys(t('connected') + ' — SHIRAZI');
    };
    ws.onclose = () => { _feedWs = null; pillOff(); setVoiceState('offline', t('offline')); scheduleFeedRetry(); };
    ws.onerror = () => { try { ws.close(); } catch {} };
    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.type === 'log') onLog(m);
      else if (m.type === 'status') onStatus(m);
      else if (m.type === 'sys') sys(m.text);
      else if (m.type === 'file_received') onFileReceived(m);
      else if (m.type === 'confirm_request') showConfirm(m);
    };
  }
  function scheduleFeedRetry() {
    sys(t('connection_lost'));
    setTimeout(() => { if (_feedWanted) feedConnect(); }, _feedBackoff);
    _feedBackoff = Math.min(_feedBackoff * 2, 15000);
  }

  function onStatus(m) {
    if (m.state === 'active') pillLive();
  }
  function onLog(m) {
    append(m.speaker === 'shirazi' || m.speaker === 'jarvis' ? 'shirazi' : 'user', m.text);
    if ((m.speaker === 'shirazi' || m.speaker === 'jarvis') && _speakOn) {
      const recent = Date.now() - _lastVoiceAt < 45000;
      if (_activeView === 'view-voice' || recent) speak(m.text);
    }
  }

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function append(speaker, text) {
    const d = document.createElement('div');
    if (speaker === 'shirazi') {
      d.className = 'msg msg-j';
      d.innerHTML = `<div class="lbl">Shirazi</div>${esc(text)}`;
    } else {
      d.className = 'msg msg-u';
      d.innerHTML = `<div class="lbl">You</div>${esc(text)}`;
    }
    feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
  }
  function sys(text) {
    const d = document.createElement('div');
    d.className = 'msg msg-sys'; d.textContent = text;
    feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
  }
  </script>

  <script>
  // ── Confirm modal (Approve/Deny for gated agent steps) ────────────────────
  let _confirmId = null, _confirmTimer = null;
  function showConfirm(m) {
    _confirmId = m.id;
    document.getElementById('confirm-tool').textContent = '🔒 ' + m.tool;
    document.getElementById('confirm-why').textContent = m.why || '';
    document.getElementById('confirm-args').textContent = m.args || '';
    document.getElementById('confirm-modal').classList.add('show');
    const total = Math.max(5, Math.round(m.timeout_s || 90));
    let left = total;
    const fill = document.getElementById('confirm-fill');
    const timerEl = document.getElementById('confirm-timer');
    clearInterval(_confirmTimer);
    const tickFn = () => {
      timerEl.textContent = t('confirm_expires').replace('{s}', left);
      fill.style.width = (left / total * 100) + '%';
      if (--left < 0) { hideConfirm(); sys('Confirmation timed out.'); }
    };
    tickFn(); _confirmTimer = setInterval(tickFn, 1000);
    if (navigator.vibrate) navigator.vibrate(60);
  }
  function hideConfirm() {
    document.getElementById('confirm-modal').classList.remove('show');
    clearInterval(_confirmTimer); _confirmId = null;
  }
  function answerConfirm(approved) {
    if (!_confirmId) return;
    const id = _confirmId;
    cmdSend({ type: 'confirm_response', id, approved })
      .then(ok => { if (!ok) toast(t('connection_lost')); })
      .catch(() => toast(t('connection_lost')));
    sys(approved ? '✓ ' + t('approve') : '✕ ' + t('deny'));
    hideConfirm();
  }
  document.getElementById('confirm-approve').addEventListener('click', () => answerConfirm(true));
  document.getElementById('confirm-deny').addEventListener('click', () => answerConfirm(false));

  // ── Command socket (/ws/cmd) with auto-reconnect ─────────────────────────
  let _cmdWs = null, _cmdBackoff = 1000, _cmdQueue = [];
  function cmdConnect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    let ws;
    try { ws = new WebSocket(`${proto}://${location.host}/ws/cmd?token=${encodeURIComponent(_authToken)}`); }
    catch { scheduleCmdRetry(); return; }
    _cmdWs = ws;
    ws.onopen = () => {
      _cmdBackoff = 1000;
      while (_cmdQueue.length && _cmdWs && _cmdWs.readyState === 1) _cmdWs.send(JSON.stringify(_cmdQueue.shift()));
    };
    ws.onclose = () => { _cmdWs = null; scheduleCmdRetry(); };
    ws.onerror = () => { try { ws.close(); } catch {} };
    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.type === 'error' && m.error) toast(m.error);
      if ((m.type === 'key' || m.type === 'click' || m.type === 'scroll' || m.type === 'volume') && m.ok === false && m.error)
        toast(m.error);
    };
  }
  function scheduleCmdRetry() {
    setTimeout(() => cmdConnect(), _cmdBackoff);
    _cmdBackoff = Math.min(_cmdBackoff * 2, 15000);
  }
  function cmdSend(obj) {
    return new Promise((resolve) => {
      if (_cmdWs && _cmdWs.readyState === 1) {
        try { _cmdWs.send(JSON.stringify(obj)); resolve(true); } catch { resolve(false); }
      } else {
        _cmdQueue.push(obj);
        if (!_cmdWs) cmdConnect();
        setTimeout(() => resolve(false), 2500);
      }
    });
  }

  // ── Chat → /api/agent ─────────────────────────────────────────────────────
  let _agentBusy = false;
  async function sendAgent(text, opts = {}) {
    text = (text || '').trim();
    if (!text || _agentBusy) return;
    _agentBusy = true;
    if (!opts.silent) append('user', text);
    pillBusy(t('thinking'));
    setVoiceState('thinking', t('thinking') + '…');
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 120000);
    try {
      const r = await _authFetch('/api/agent', {
        method: 'POST', signal: ctl.signal,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      const j = await r.json();
      if (!r.ok) { sys(j.error || ('Error ' + r.status)); return; }
      if (j.answer) {
        append('shirazi', j.answer);
        showResponse(j.answer);
        if (_speakOn) speak(j.answer);
      }
      if (j.pending) inlinePending(j.pending);
      if (j.status && j.status !== 'completed' && !j.answer) sys('Status: ' + j.status);
    } catch (e) {
      sys(e.name === 'AbortError' ? 'Timed out — the desktop is still working.' : t('connection_lost'));
    } finally {
      clearTimeout(timer); _agentBusy = false; pillLive();
      if (!_voiceWs) setVoiceState('idle', t('tap_to_speak'));
    }
  }
  function showResponse(text) {
    const card = document.getElementById('response-card');
    document.getElementById('response-text').innerHTML =
      `<div class="lbl">Shirazi</div>${esc(text)}`;
    card.classList.add('show');
  }
  function inlinePending(p) {
    const d = document.createElement('div');
    d.className = 'msg msg-pending';
    d.innerHTML = `<div class="lbl" style="color:var(--amber)">🔒 ${t('confirm_title')}</div>
      <div style="font-family:ui-monospace,monospace;font-size:12px;font-weight:700">${esc(p.tool)}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">${esc(p.why || '')}</div>
      <div class="confirm-btns">
        <button class="btn danger" style="flex:1">${t('deny')}</button>
        <button class="btn ok" style="flex:1">${t('approve')}</button>
      </div>`;
    const [deny, approve] = d.querySelectorAll('button');
    const done = (ok) => {
      deny.disabled = approve.disabled = true;
      _authFetch('/api/agent/confirm', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: p.id, approved: ok }),
      }).then(r => r.json()).then(j => {
        if (j.result) { append('shirazi', j.result); if (_speakOn) speak(j.result); }
        else sys(j.error || (ok ? '✓' : '✕'));
        d.remove();
      }).catch(() => { sys(t('connection_lost')); d.remove(); });
    };
    deny.addEventListener('click', () => done(false));
    approve.addEventListener('click', () => done(true));
    feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
  }
  document.getElementById('send-btn').addEventListener('click', () => {
    const inp = document.getElementById('inp');
    const v = inp.value; inp.value = '';
    sendAgent(v);
  });
  document.getElementById('inp').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const v = e.target.value; e.target.value = '';
      sendAgent(v);
    }
  });
  document.getElementById('chat-mic').addEventListener('click', () => {
    document.querySelector('nav button[data-view="view-voice"]').click();
    setTimeout(() => toggleVoice(), 350);
  });

  // ── File upload (phone → computer) ────────────────────────────────────────
  function _fileIcon(name) {
    const ext = (name.split('.').pop() || '').toLowerCase();
    if (['jpg','jpeg','png','gif','webp','heic','heif','avif','bmp','svg'].includes(ext)) return '🖼️';
    if (['mp4','mov','avi','mkv','webm','m4v','3gp'].includes(ext)) return '🎬';
    if (['mp3','m4a','wav','flac','aac','ogg','opus'].includes(ext)) return '🎵';
    if (['pdf'].includes(ext)) return '📋';
    if (['doc','docx','txt','md','rtf','odt'].includes(ext)) return '📝';
    if (['xls','xlsx','csv','ods'].includes(ext)) return '📊';
    if (['ppt','pptx','odp'].includes(ext)) return '📑';
    if (['zip','rar','7z','tar','gz','bz2','xz'].includes(ext)) return '📦';
    return '📎';
  }
  function _fmtSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
    if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
    return (b / 1073741824).toFixed(2) + ' GB';
  }
  document.getElementById('file-inp').addEventListener('change', function () {
    Array.from(this.files).forEach((file) => {
      const fd = new FormData(); fd.append('file', file);
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', 'Bearer ' + _authToken);
      xhr.onload = () => toast(xhr.status === 200 ? '✓ ' + file.name : 'Upload failed');
      xhr.onerror = () => toast(t('connection_lost'));
      xhr.send(fd);
    });
    this.value = '';
  });
  function onFileReceived(m) {
    sys('📎 ' + m.name + ' (' + _fmtSize(m.size) + ')');
    toast('File received on computer');
  }

  // ── Voice: tap-to-talk / hold-to-talk → PCM16 WebSocket ───────────────────
  // Audio path: phone mic → /ws/phone-audio (PCM16 @16kHz) → the desktop's
  // Live AI session, server-side (API keys never touch the phone). The
  // assistant's reply text returns over the feed socket and is spoken here
  // with the phone's on-device speech synthesis — free, no server TTS needed.
  const talkBtn = document.getElementById('talk-btn');
  let _voiceWs = null, _audioCtx = null, _micStm = null, _audioNd = null, _analyser = null;
  let _lastVoiceAt = 0, _speakOn = localStorage.getItem('shirazi_speak') !== 'off';
  const _speakToggle = document.getElementById('speak-toggle');
  _speakToggle.classList.toggle('on', _speakOn);
  _speakToggle.addEventListener('click', () => {
    _speakOn = !_speakOn;
    _speakToggle.classList.toggle('on', _speakOn);
    localStorage.setItem('shirazi_speak', _speakOn ? 'on' : 'off');
    if (!_speakOn && 'speechSynthesis' in window) speechSynthesis.cancel();
  });

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.slice(0, 600));
      const lang = document.documentElement.lang || 'en';
      u.lang = lang === 'ur' ? 'ur-PK' : lang === 'ar' ? 'ar-SA' : 'en-US';
      u.rate = 1.02;
      u.onstart = () => setVoiceState('speaking', '🔊 SHIRAZI');
      u.onend = u.onerror = () => { if (!_voiceWs) setVoiceState('idle', t('tap_to_speak')); };
      speechSynthesis.speak(u);
    } catch {}
  }

  function _f32toPcm16(f32, srcRate) {
    let s = f32;
    if (srcRate !== 16000) {
      const ratio = srcRate / 16000;
      const len = Math.round(f32.length / ratio);
      s = new Float32Array(len);
      for (let i = 0; i < len; i++) s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
    }
    const out = new Int16Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
    return out.buffer;
  }

  async function startVoice() {
    if (_voiceWs) return;
    if (!navigator.mediaDevices?.getUserMedia) { _showVoiceSetup(); return; }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
      });
    } catch (e) {
      sys(e.name === 'NotAllowedError'
        ? 'Microphone denied — tap the address bar lock and allow microphone.'
        : 'Mic error: ' + (e.message || e.name));
      return;
    }
    let ctx;
    try { ctx = new AudioContext({ sampleRate: 16000 }); }
    catch (_) { ctx = new AudioContext(); }
    if (ctx.state === 'suspended') await ctx.resume();

    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`);
    ws.binaryType = 'arraybuffer';
    ws.onopen = async () => {
      const rate = ctx.sampleRate;
      const src = ctx.createMediaStreamSource(stream);
      _analyser = ctx.createAnalyser(); _analyser.fftSize = 512;
      src.connect(_analyser);
      const wCode = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
      try {
        const burl = URL.createObjectURL(new Blob([wCode], { type: 'application/javascript' }));
        await ctx.audioWorklet.addModule(burl);
        URL.revokeObjectURL(burl);
        const nd = new AudioWorkletNode(ctx, 'j');
        let _pbuf = [], _plen = 0;
        nd.port.onmessage = (e) => {
          const chunk = new Int16Array(_f32toPcm16(e.data, rate));
          _pbuf.push(chunk); _plen += chunk.length;
          if (_plen >= 1024) {
            const out = new Int16Array(_plen); let off = 0;
            for (const c of _pbuf) { out.set(c, off); off += c.length; }
            if (ws.readyState === 1) ws.send(out.buffer);
            _pbuf = []; _plen = 0;
          }
        };
        src.connect(nd);
        _audioNd = nd;
      } catch (_) {
        const sp = ctx.createScriptProcessor(4096, 1, 1);
        sp.onaudioprocess = (e) => {
          if (ws.readyState === 1) ws.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
        };
        src.connect(sp); sp.connect(ctx.destination);
        _audioNd = sp;
      }
      talkBtn.classList.add('live'); talkBtn.textContent = '⏹';
      setVoiceState('listening', t('listening'));
      _lastVoiceAt = Date.now();
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      // mic level → reactor
      const buf = new Float32Array(_analyser.fftSize);
      (function meter() {
        if (!_voiceWs) return;
        _analyser.getFloatTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
        _reactor.level = Math.min(1, Math.sqrt(sum / buf.length) * 4);
        requestAnimationFrame(meter);
      })();
    };
    ws.onclose = () => stopVoice();
    ws.onerror = () => { sys('Voice connection failed.'); stopVoice(); };
    _voiceWs = ws; _audioCtx = ctx; _micStm = stream;
  }
  function stopVoice() {
    if (_audioNd)  { try { _audioNd.disconnect(); } catch {} _audioNd = null; }
    _analyser = null;
    if (_audioCtx) { try { _audioCtx.close(); } catch {} _audioCtx = null; }
    if (_micStm)   { _micStm.getTracks().forEach(tr => tr.stop()); _micStm = null; }
    if (_voiceWs)  { const w = _voiceWs; _voiceWs = null; if (w.readyState < 2) w.close(); }
    talkBtn.classList.remove('live'); talkBtn.textContent = '🎤';
    setVoiceState('thinking', t('thinking') + '…');
    _lastVoiceAt = Date.now();
    setTimeout(() => { if (!_voiceWs && _reactor.state === 'thinking') setVoiceState('idle', t('tap_to_speak')); }, 20000);
  }
  function toggleVoice() { _voiceWs ? stopVoice() : startVoice(); }

  // tap (<280ms) toggles; press-and-hold streams while held
  let _pressT = 0, _holdFired = false, _holdTimer = null;
  talkBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    _pressT = Date.now(); _holdFired = false;
    _holdTimer = setTimeout(() => {
      if (!_voiceWs) { _holdFired = true; startVoice(); }
    }, 280);
  });
  const _pressEnd = () => {
    clearTimeout(_holdTimer);
    if (_holdFired) { stopVoice(); }           // it was a hold → stop
    else if (Date.now() - _pressT < 1500) { toggleVoice(); }  // it was a tap → toggle
    _holdFired = false;
  };
  talkBtn.addEventListener('pointerup', _pressEnd);
  talkBtn.addEventListener('pointercancel', _pressEnd);

  function _showVoiceSetup() {
    if (document.getElementById('voice-setup')) return;
    const card = document.createElement('div');
    card.id = 'voice-setup';
    card.className = 'card glass';
    card.style.cssText = 'width:100%';
    card.innerHTML =
      `<h3>🎤 ${t('voice_setup_title')}</h3>
       <div style="font-size:13px;line-height:2;color:var(--muted)">
       1. Open <span style="font-family:monospace;background:rgba(255,255,255,0.07);padding:1px 6px;border-radius:4px">chrome://flags</span><br>
       2. Search <b style="color:var(--text)">Insecure origins treated as secure</b><br>
       3. Add <span style="font-family:monospace;background:rgba(255,255,255,0.07);padding:1px 6px;border-radius:4px">${esc(location.origin)}</span> → Enabled → Relaunch<br>
       4. Or open this page over <b style="color:var(--text)">HTTPS</b> — mic then works with no flags.</div>`;
    document.getElementById('view-voice').appendChild(card);
  }
  </script>

  <script>
  // ── Remote: touchpad ──────────────────────────────────────────────────────
  // Gestures: drag → move · double-tap → left click · long-press → right click
  // · two-finger drag → scroll. All through the authenticated /ws/cmd channel.
  const pad = document.getElementById('pad');
  let _padPtr = null, _padLast = null, _padTapAt = 0, _padTapPos = null;
  let _padLongTimer = null, _padMoved = 0, _padDownAt = 0;
  let _padSecond = null, _padScrollAcc = 0, _padLastSend = 0;
  const sensEl = document.getElementById('sens');
  document.getElementById('sens-val').textContent = Number(sensEl.value).toFixed(1);
  sensEl.addEventListener('input', () => {
    document.getElementById('sens-val').textContent = Number(sensEl.value).toFixed(1);
  });

  pad.addEventListener('pointerdown', (e) => {
    pad.setPointerCapture(e.pointerId);
    if (_padPtr === null) {
      _padPtr = e.pointerId; _padLast = { x: e.clientX, y: e.clientY };
      _padMoved = 0; _padDownAt = Date.now();
      cmdSend({ type: 'touchpad_start' });
      _padLongTimer = setTimeout(() => {
        if (_padMoved < 12 && _padPtr !== null) {
          cmdSend({ type: 'touchpad_click', button: 'right' });
          if (navigator.vibrate) navigator.vibrate(40);
          _padPtr = 'longpress';  // swallow the up-event
        }
      }, 550);
    } else if (_padSecond === null) {
      _padSecond = { id: e.pointerId, y: e.clientY };  // two-finger → scroll
      clearTimeout(_padLongTimer);
    }
    e.preventDefault();
  });
  pad.addEventListener('pointermove', (e) => {
    if (e.pointerId === _padSecond?.id) {
      const dy = e.clientY - _padSecond.y;
      _padScrollAcc += dy; _padSecond.y = e.clientY;
      if (Math.abs(_padScrollAcc) > 44) {
        const dir = _padScrollAcc < 0 ? 'up' : 'down';
        cmdSend({ type: 'scroll', direction: dir, amount: 3 });
        _padScrollAcc = 0;
      }
      return;
    }
    if (e.pointerId !== _padPtr || _padPtr === 'longpress') return;
    const dx = e.clientX - _padLast.x, dy = e.clientY - _padLast.y;
    _padLast = { x: e.clientX, y: e.clientY };
    _padMoved += Math.abs(dx) + Math.abs(dy);
    if (_padMoved > 12) clearTimeout(_padLongTimer);
    const now = performance.now();
    if (now - _padLastSend > 50) {
      _padLastSend = now;
      cmdSend({ type: 'touchpad_move', dx: Math.round(dx), dy: Math.round(dy),
                sensitivity: Number(sensEl.value) });
    }
  });
  const padUp = (e) => {
    clearTimeout(_padLongTimer);
    if (e.pointerId === _padSecond?.id) { _padSecond = null; _padScrollAcc = 0; return; }
    if (e.pointerId !== _padPtr) return;
    const wasLong = _padPtr === 'longpress';
    _padPtr = null;
    if (wasLong) return;
    const dt = Date.now() - _padDownAt;
    if (dt < 320 && _padMoved < 12) {
      const now = Date.now();
      if (now - _padTapAt < 380) {
        cmdSend({ type: 'touchpad_click', button: 'left' });  // double-tap
        _padTapAt = 0;
      } else {
        _padTapAt = now;
        _padTapPos = { x: e.clientX, y: e.clientY };
      }
    }
  };
  pad.addEventListener('pointerup', padUp);
  pad.addEventListener('pointercancel', (e) => {
    clearTimeout(_padLongTimer);
    if (e.pointerId === _padSecond?.id) { _padSecond = null; _padScrollAcc = 0; }
    if (e.pointerId === _padPtr) _padPtr = null;
  });
  document.getElementById('click-left').addEventListener('click', () =>
    cmdSend({ type: 'touchpad_click', button: 'left' }));
  document.getElementById('click-right').addEventListener('click', () =>
    cmdSend({ type: 'touchpad_click', button: 'right' }));

  // ── Remote: D-pad ─────────────────────────────────────────────────────────
  document.querySelectorAll('[data-key]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.key;
      cmdSend({ type: 'dpad', key });
      if (navigator.vibrate) navigator.vibrate(12);
    });
  });

  // ── Remote: quick commands ────────────────────────────────────────────────
  let _quickLoaded = false;
  async function loadQuick() {
    try {
      const r = await _authFetch('/api/quick-commands');
      const j = await r.json();
      const grid = document.getElementById('quick-grid');
      grid.innerHTML = '';
      for (const c of j.commands || []) {
        const b = document.createElement('button');
        b.className = 'qc glass';
        b.innerHTML = `<span class="qi">${esc(c.icon || '❓')}</span><span>${esc(c.label)}</span>`;
        b.addEventListener('click', () => runQuick(c));
        grid.appendChild(b);
      }
      _quickLoaded = true;
    } catch { /* offline — grid stays empty, honestly */ }
  }
  async function runQuick(c) {
    const box = document.getElementById('quick-result');
    box.classList.add('show');
    box.textContent = '⏳ ' + c.label + '…';
    try {
      const r = await _authFetch('/api/quick-commands/run', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: c.id }),
      });
      const j = await r.json();
      if (j.answer) {
        box.textContent = j.answer;
        if (_speakOn) speak(j.answer);
      } else box.textContent = j.error || ('Status: ' + j.status);
    } catch { box.textContent = t('connection_lost'); }
  }
  document.getElementById('qc-add').addEventListener('click', () => {
    document.getElementById('qc-form').style.display = 'flex';
  });
  document.getElementById('qc-cancel').addEventListener('click', () => {
    document.getElementById('qc-form').style.display = 'none';
  });
  document.getElementById('qc-save').addEventListener('click', async () => {
    const label = document.getElementById('qc-label').value.trim() || 'Custom';
    const prompt = document.getElementById('qc-prompt').value.trim();
    if (!prompt) { toast(t('qc_prompt')); return; }
    try {
      const cur = await (await _authFetch('/api/quick-commands')).json();
      const cmds = (cur.commands || []).concat([{
        id: 'custom_' + Date.now().toString(36), label, icon: '⭐', prompt,
      }]);
      const r = await _authFetch('/api/quick-commands', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ commands: cmds }),
      });
      if (r.ok) {
        document.getElementById('qc-form').style.display = 'none';
        document.getElementById('qc-label').value = '';
        document.getElementById('qc-prompt').value = '';
        loadQuick(); toast('✓');
      } else toast('Save failed');
    } catch { toast(t('connection_lost')); }
  });

  // ── System: telemetry (throttled 3 s poll) ────────────────────────────────
  let _teleTimer = null;
  async function loadTelemetry() {
    try {
      const r = await _authFetch('/api/telemetry');
      const j = await r.json();
      const box = document.getElementById('telemetry');
      box.innerHTML = '';
      for (const row of j.rows || []) {
        const val = row.value == null ? 0 : Math.max(0, Math.min(100, row.value));
        const d = document.createElement('div');
        d.className = 'trow';
        const warn = (row.label === 'CPU' || row.label === 'RAM' || row.label === 'DISK') && val > 85;
        d.innerHTML = `<div class="tl"><span>${esc(row.label)}</span><span class="tv">${esc(row.display)}</span></div>
          <div class="tbar"><div class="fill${warn ? ' warn' : ''}" style="width:${val}%"></div></div>`;
        box.appendChild(d);
      }
    } catch { /* offline — keep last values */ }
    clearTimeout(_teleTimer);
    _teleTimer = setTimeout(() => { if (_activeView === 'view-system') loadTelemetry(); }, 3000);
  }

  // ── System: audio devices ─────────────────────────────────────────────────
  async function loadAudio(rescan = false) {
    const si = document.getElementById('sel-in'), so = document.getElementById('sel-out');
    try {
      const r = await _authFetch('/api/audio-devices' + (rescan ? '?rescan=true' : ''));
      const j = await r.json();
      if (!j.available) {
        document.getElementById('state-in').textContent = j.error || 'unavailable';
        return;
      }
      const fill = (sel, items, current) => {
        sel.innerHTML = '';
        const opts = [''].concat(items || []);
        for (const n of opts) {
          const o = document.createElement('option');
          o.value = n; o.textContent = n || '(system default)';
          if (n === current) o.selected = true;
          sel.appendChild(o);
        }
      };
      fill(si, j.input, j.selected?.input || '');
      fill(so, j.output, j.selected?.output || '');
      document.getElementById('state-in').textContent = j.state?.input || '';
      document.getElementById('state-out').textContent = j.state?.output || '';
      if (rescan) toast('✓ ' + t('rescan'));
    } catch { /* offline */ }
  }
  async function selectAudio(kind, name) {
    try {
      const r = await _authFetch('/api/audio-devices', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kind, name }),
      });
      const j = await r.json();
      toast(r.ok && j.ok ? '✓' : (j.error || 'Failed'));
      loadAudio();
    } catch { toast(t('connection_lost')); }
  }
  document.getElementById('sel-in').addEventListener('change', (e) => selectAudio('input', e.target.value));
  document.getElementById('sel-out').addEventListener('change', (e) => selectAudio('output', e.target.value));
  document.getElementById('audio-rescan').addEventListener('click', () => loadAudio(true));
  document.getElementById('audio-test').addEventListener('click', async () => {
    try {
      const r = await _authFetch('/api/audio-devices/test', { method: 'POST' });
      const j = await r.json();
      toast(j.message || (j.ok ? '✓' : 'Failed'));
    } catch { toast(t('connection_lost')); }
  });

  // ── System: session ───────────────────────────────────────────────────────
  async function loadSession() {
    try {
      const r = await _authFetch('/api/session');
      const j = await r.json();
      const b = j.backend || {};
      const liveTxt = b.live === true ? t('backend_live_yes') : b.live === false ? t('backend_live_no') : t('backend_unknown');
      const row = (k, v, cls) => `<div class="kv"><span class="k">${k}</span><span class="v ${cls || ''}">${v}</span></div>`;
      document.getElementById('session-info').innerHTML =
        row(t('agent_available'), j.agent_available ? '✓' : '✕', j.agent_available ? 'good' : 'bad') +
        row(t('backend_live'), esc(liveTxt), b.live === true ? 'good' : '') +
        row('Pending confirms', j.pending_confirms ?? 0) +
        row('AES-256', _encReady ? '✓' : '✕', _encReady ? 'good' : 'bad');
    } catch { /* offline */ }
  }
  document.getElementById('btn-logout').addEventListener('click', () => {
    _feedWanted = false;
    try { _feedWs?.close(); _cmdWs?.close(); } catch {}
    for (const k of ['shirazi_token', 'shirazi_key', 'jarvis_token', 'jarvis_key'])
      sessionStorage.removeItem(k);
    localStorage.removeItem('shirazi_device_token');
    localStorage.removeItem('jarvis_device_token');
    location.replace('/login');
  });
  document.getElementById('btn-revoke').addEventListener('click', async () => {
    try {
      const r = await _authFetch('/api/revoke-devices', { method: 'POST' });
      const j = await r.json();
      toast(r.ok ? `✓ ${j.revoked || 0}` : (j.error || 'Failed'));
    } catch { toast(t('connection_lost')); }
  });

  // ── PWA install ───────────────────────────────────────────────────────────
  let _deferredPrompt = null;
  addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); _deferredPrompt = e;
    document.getElementById('install-btn').style.display = 'block';
  });
  document.getElementById('install-btn').addEventListener('click', async () => {
    if (_deferredPrompt) { _deferredPrompt.prompt(); _deferredPrompt = null; }
    else toast('Use the browser menu → Add to Home Screen');
  });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  (async function boot() {
    const savedLang = localStorage.getItem('shirazi_lang') || 'en';
    document.getElementById('lang-sel').value = savedLang;
    await _loadLang(savedLang);
    document.getElementById('lang-sel').addEventListener('change', (e) => {
      localStorage.setItem('shirazi_lang', e.target.value);
      _loadLang(e.target.value);
    });
    feedConnect();
    cmdConnect();
    sys('SHIRAZI dashboard · ' + location.host);
  })();
  </script>
</body>
